data_dir: /var/lib/vps-agents          # state.db + worktrees live here (NOT inside your projects)

sandbox:
  mode: docker                          # "local" = no isolation, tests only
  image: vpsa-agent:latest
  gateway_network: vpsa-gateway         # docker network --internal; only FreeLLMAPI is attached
  memory: 2g
  cpus: "2"
  timeout_seconds: 1800

llm:                                    # FreeLLMAPI (OpenAI-compatible)
  base_url: http://freellmapi:3001/v1
  api_key_env: FREELLMAPI_API_KEY       # read from the environment, never from this file
  model: auto
  # Strong models think, weak models type. Classes: architect (plans + diagnoses), reviewer, analyst
  # (investigator/sre/security/git reports), worker (roles that edit files). A role name beats its class.
  # Pick names from `python -m vpsagents.probe` output; leave a class out to fall back to `model` above.
  models:
    architect: auto
    reviewer: auto
    analyst: auto
    worker: auto

worker:
  # Runs INSIDE the sandbox on a throwaway copy of the tracked files (own tiny git repo, so aider's repo map works).
  # aider edits files from plain-text diffs, so weaker free models work. Verify each flag with `aider --help`
  # in your image (written against aider 0.86.2). The model comes from LLM_MODEL (set per role by llm.models).
  command:
    - sh
    - -c
    - >-
      exec aider --model "openai/$LLM_MODEL" --message-file /task/prompt.md --yes-always --no-auto-commits
      --no-pretty --no-stream --no-analytics --no-check-update --no-show-model-warnings --no-suggest-shell-commands
      --no-detect-urls --no-gitignore
  # Plan / review / reports: aider's ask mode answers without editing files.
  readonly_command:
    - sh
    - -c
    - >-
      exec aider --model "openai/$LLM_MODEL" --chat-mode ask --message-file /task/prompt.md --yes-always
      --no-auto-commits --no-pretty --no-stream --no-analytics --no-check-update --no-show-model-warnings
      --no-suggest-shell-commands --no-detect-urls --no-gitignore

# Free-quota protection (see docs/FREE-TOKENS.md). One agent run = one worker session (edit, repair or review).
max_agent_runs_per_job: 8               # a runaway repair loop stops here
max_agent_runs_per_day: 150             # UTC day across all jobs; null = unlimited. Set a bit under your real daily budget
max_repairs: 2                          # verify-fail -> feed output back to the worker, up to N times
architect_plan: true                     # strong model writes a plan before the weak worker edits
escalate_after_failures: 2              # after 2 failed verifications the architect diagnoses for the worker
max_strong_runs_per_day: null           # cap strong-model sessions separately (free tiers are scarce)
memory_enabled: true                    # retrieve project memory into prompts; finished jobs add notes automatically
cpu_alert_percent: 95                   # monitor opens an incident above this (null disables)
memory_alert_percent: 90
review_pass: true                       # second model pass must end with "VERDICT: APPROVE" for tier-3 auto-apply
approval_ttl_minutes: 720

projects:
  - name: torrent-studio
    path: /home/ubuntu/torrent-studio
    tier: 2                             # 0 observe | 1 propose | 2 assisted | 3 trusted
    default_branch: main
    containers: [torrent-studio]
    health_url: http://127.0.0.1:8000/health
    deploy_command: [docker, compose, up, -d, --build]   # argv list, never a shell string
    verify_commands:
      - [python3, -m, unittest, discover]
    verify_network: none                # "bridge" only if tests truly need the internet

  - name: notes-app
    path: /home/ubuntu/notes-app
    tier: 0                             # watch only: incidents + investigations
    containers: [notes-app]
    health_url: http://127.0.0.1:9000/health
