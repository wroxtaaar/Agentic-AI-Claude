[project]
name = "vps-agents"
version = "0.1.0"
description = "Control plane for AI agents that maintain projects on a VPS: sandboxed workers, autonomy tiers, approval gates."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
vpsagents = "vpsagents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpsagents = ["roles/*.yaml", "roles/personas/*"]
